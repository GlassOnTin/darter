# CI for the darter repo, two tiers:
#   cargo:        the offline `cargo test` suite (no GPU, no network).
#   godot-replay: the #[ignore]d renderer suites (tests/godot.rs,
#                 tests/godot_pack.rs, tests/godot_live.rs), which need the
#                 pinned Godot 4.7.2 binary and an X display. The tests
#                 spawn their own xvfb-run wrappers, so the job only needs
#                 xvfb installed.
#
# tests/godot_live.rs additionally builds tools/gdext (the standalone
# godot-rust GDExtension crate) and stages the .so before running; the
# build step runs before the import pass so extension_list.cfg registers
# the class in the fresh checkout too.
#
# The Godot binary is downloaded from the official 4.7.2-stable GitHub
# release and verified against tools/godot/SHA512-SUMS.txt (the release's
# published sums, committed here); the test suites re-verify the extracted
# binary's sha256 at runtime.

name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # area_pack's tests shell out to tools/area_pack.py, which imports
      # numpy + tifffile on the GLO-30 path
      - run: pip install numpy tifffile
      - run: cargo test

  godot-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tools/gdext is a standalone crate (its own Cargo.lock/target, so the
      # offline cargo tier never touches Godot bindings); cache it too or
      # every CI run recompiles the bindings from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/gdext
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # T8's bundle-vs-regen comparison runs tools/godot_smoke/make_bundle.sh
      - run: pip install numpy tifffile
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Install pinned Godot (sha512-verified against the committed sums)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          test "$(grep -cF '  Godot_v4.7.2-stable_linux.x86_64.zip' tools/godot/SHA512-SUMS.txt)" = 1
          grep -F '  Godot_v4.7.2-stable_linux.x86_64.zip' tools/godot/SHA512-SUMS.txt \
            | sed "s#  Godot_v4.7.2-stable_linux.x86_64.zip#  $RUNNER_TEMP/godot.zip#" > "$RUNNER_TEMP/godot.sums"
          sha512sum -c "$RUNNER_TEMP/godot.sums"
          mkdir -p tools/godot/bin
          unzip -j -o "$RUNNER_TEMP/godot.zip" 'Godot_v4.7.2-stable_linux.x86_64' -d tools/godot/bin/
          mv tools/godot/bin/Godot_v4.7.2-stable_linux.x86_64 tools/godot/bin/godot
          chmod +x tools/godot/bin/godot
          tools/godot/bin/godot --version
      - name: Build sim_run and regenerate the demo bundle (areas/ is gitignored payload)
        run: |
          cargo build --bin sim_run
          tools/godot_smoke/make_bundle.sh
      # libdarter_gd.so is a gitignored payload staged into the project by
      # tests/godot_live.rs; building it first means the import pass below
      # registers the DarterQuad class and the replay suites exercise the
      # same loaded extension.
      - name: Build the darter-gd GDExtension
        run: cargo build --release --manifest-path tools/gdext/Cargo.toml
      # Game-mode runs only consume the project's import cache (.godot/); a
      # fresh checkout has none, so run the editor's import pass once.
      # Verified 2026-10-03 from a wiped cache: exit 0 and the s3tc ctex
      # files the replay scripts preload land in .godot/imported/.
      - name: Import project resources (headless editor pass)
        run: tools/godot/bin/godot --headless --path tools/godot_smoke --import
      - name: T5 record-to-movie replay smoke
        run: cargo test --test godot -- --ignored
      - name: T7 corridor + T8 demo-areas replay suites
        run: cargo test --test godot_pack -- --ignored
      - name: M2a live-plant parity (GDExtension flight loop vs sim_run)
        run: cargo test --test godot_live -- --ignored