; Refresh-vote Android plugin (v2): hand-rolled AAR that votes the window and
; render surface up to the phone's high-refresh tier (>=90 Hz). Java sources
; and the AAR build recipe live in <project>/refresh_vote/; the export shim
; below is what tells the Gradle build to merge that AAR into the app.
[plugin]

name="refresh_vote"
description="Votes the display mode and render surface for >=90 Hz on Android"
author="darter"
version="1.0"
script="./export_plugin.gd"