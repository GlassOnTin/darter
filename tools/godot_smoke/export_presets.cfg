; Android export preset for the on-device smoke test. Prebuilt-template
; export (gradle_build/use_gradle_build=false): the pinned templates carry
; android_debug/release.apk, so no Gradle/SDK-manager churn.
; The scene is the project's main_scene — the shipped template is compiled
; with disable_path_overrides=yes and REFUSES a scene path on the command
; line, so the export is made from a copy of this project with
; run/main_scene="res://pack_replay.tscn" and export_path pointed somewhere
; writable (the repo copy keeps replay.tscn, which tests/godot.rs depends
; on). export_path must name an EXISTING directory: Godot errors out rather
; than creating it (mkdir -p build first).
[preset.0]

name="Android"
platform="Android"
export_path="build/darter-smoke.apk"
export_filter="all_resources"
include_filter="*/*.json, */*.packobj, */*.jsonl"
exclude_filter=""

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name=""
package/unique_name="org.darter.smoke"
package/name="darter smoke"
package/signed=true
screen/orientation=4
screen/immersive_mode=true
keystore/debug="/home/ian/.android/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"