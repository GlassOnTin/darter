; Android export preset for the demo-areas smoke test.
; Gradle build is mandatory (gradle_build/use_gradle_build=true): the
; refresh-vote plugin (addons/refresh_vote + refresh_vote/refresh_vote.aar)
; must merge its AAR into the app manifest, which only the gradle path does.
; Recipe (verified 2026-10-03 on Godot 4.7.2 / AGP 8.6.1 / compileSdk 36 —
; APK bytes in the S7 commit; superseding the 2026-09-30 pass):
;   1. SDK state: platform android-36 + build-tools 36.1.0 (the template's
;      config.gradle requires it; sdkmanager fetches build-tools), and
;      ANDROID_HOME exported for gradlew.
;   2. Build the bundle in the repo first, fully offline from the committed
;      fixtures (no network at build time — F-Droid requirement):
;        tools/godot_smoke/make_bundle.sh
;      needs python3 (numpy+tifffile) and target/debug/sim_run (cargo build
;      --bin sim_run). It regenerates
;        tools/godot_smoke/areas/<name>/{pack.json,scene.packobj,record.jsonl,track.json}
;      for the four index.json areas; areas/index.json itself is tracked
;      and never rewritten.
;   3. Export from a THROWAWAY COPY of tools/godot_smoke:
;        cp -a tools/godot_smoke <copy> && rm -rf <copy>/build
;      The copy's project.godot is sed'd to the picker as main scene:
;        run/main_scene="res://area_picker.tscn"
;      (the repo keeps run/main_scene=replay.tscn for tests/godot.rs; the
;      shipped export template refuses a scene path on the command line.
;      The picker sets DARTER_AREA itself on click — no env at launch.)
;      Copy-time steps, each mandatory (missing and gradle aborts,
;      2026-10-01; keep scene.packobj only):
;      - rm -rf ext/ live_probe.gd live_probe.tscn — the M2a live-plant
;        probe (tests/godot_live.rs) is desktop-only: live_probe.gd
;        references the DarterQuad GDExtension class and ext/ holds the
;        desktop-only .so. Not verified against an Android export
;        (android.arm64 has no library entry yet); the copy strips all of
;        it, so all_resources never ships it.
;      - cp refresh_vote/refresh_vote.aar addons/refresh_vote/ — the export
;        plugin returns the AAR path relative to addons/ (per the plugin
;        docs), but the built AAR is committed next to its Java sources;
;        without the copy JetifyTransform fails "input file does not exist".
;      - rm pack/scene.obj and any .obj.import — the export's editor
;        first-scan imports pack/scene.obj as a res: mesh and dies on
;        MAX_MESH_SURFACES (21 material groups per chunk); keep scene.packobj
;        only. The committed bundle dirs keep scene.obj for validate_pack
;        provenance; the areas/<name>/ payload ships scene.packobj either way.
;      - mkdir -p build (export_path must name an EXISTING directory).
;   4. First export in a copy installs the build template in the SAME Godot
;      invocation as the export:
;        godot --headless --path <copy> --install-android-build-template \
;          --export-debug Android
;      (running --install-android-build-template alone just runs the scene).
;      Prereq, only noticed in CI (release run 37123481333): that flag only
;      EXTRACTS android_source.zip from the installed export templates set
;      (~/.local/share/godot/export_templates/<version>/); a machine without
;      it must install the official
;      Godot_v4.7.2-stable_export_templates.tpz first (the workflow does,
;      sha512-verified against the committed sums).
;      Template unzips to <copy>/android/build; gradlew then runs
;      assembleStandardDebug. Warm gradle cache: whole export ~1 min.
;   5. The plugin AAR is committed; rebuild only on a Java change:
;        sh refresh_vote/make_aar.sh
;      (GODOT_LIB_AAR may point at <copy>/android/build/libs/release/
;      godot-lib.template_release.aar; that path is also the script default).
; Probe after every recipe change: unzip -l the APK and assert exactly
; assets/areas/index.json + assets/areas/<name>/{pack.json,scene.packobj,
; record.jsonl,track.json} x4 (17 entries) and NO assets/pack/* or
; assets/record/*; record APK bytes in the rung notes (S8) and commit body.
; Filter depth note: Godot's match() allows * to cross /, so the one-level
; and two-level patterns overlap; the 2026-10-03 probe (S8 evidence) shows
; what actually matches. If a two-level depth ever fails to ship, the
; fallback is flat assets/areas/<name>_* naming (loader path strings in
; pack_replay.gd change with it).
;    keystore/debug fields are EMPTY on purpose (2026-10-03): gradle then
;    signs with whatever debug key the machine resolves, instead of a
;    developer home path pinned in the repo. Observed fallbacks: this
;    machine (~/.android/debug.keystore present) signs CN=Android Debug;
;    the CI runner (no such file) falls back to the Godot editor's own
;    debug keystore, CN=Godot, OU=Godot Engine (digest d9b7bada...8aea22,
;    release run 37123832311's APK). Both are debug signatures; the CI
;    cert is stable across machines, but a locally-built APK has a
;    different cert than a CI one, so switching install sources on a
;    device needs an uninstall first. CI's release workflow
;    (.github/workflows/release.yml) runs steps 2-4 verbatim.
[preset.0]

name="Android"
platform="Android"
export_path="build/darter-smoke.apk"
export_filter="all_resources"
include_filter="*/*.json, */*/*.json, */*.packobj, */*/*.packobj, */*.jsonl, */*/*.jsonl"
exclude_filter="pack/*, record/*"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; true since the refresh-vote plugin (2026-09-30): gradle merges its AAR
; (plugins_local_binaries); prebuilt templates cannot carry Android plugins.
gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name=""
package/unique_name="org.darter.smoke"
package/name="darter smoke"
package/signed=true
screen/orientation=4
screen/immersive_mode=true
; emptied 2026-10-03: gradle signs with the standard auto-generated debug
; keystore (~/.android/debug.keystore); see the header note above.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""